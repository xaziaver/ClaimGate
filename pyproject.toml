[project]
name = "claimgate"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
# The toolchain every Gauntlet gate shells out to, all invoked as `python -m`
# against this project's .venv — see gauntlet/adapters/python.py's interpreter()
# resolution order. jscpd is the one exception: the duplication gate calls it
# directly, so it comes from Node and is not listed here.
dev = [
    "pytest",
    "pytest-bdd",
    "pytest-cov",
    "coverage",
    "mutmut",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "--ignore=mutants"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
strict = true

[tool.mutmut]
source_paths = ["src/claimgate/domain/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
also_copy = ["conftest.py", "tests/"]