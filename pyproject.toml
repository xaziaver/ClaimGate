[project]
name = "claimgate"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "--ignore=mutants"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
strict = true

[tool.mutmut]
source_paths = ["src/claimgate/domain/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
also_copy = ["conftest.py", "tests/"]